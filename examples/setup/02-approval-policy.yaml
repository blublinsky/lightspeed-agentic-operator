# ApprovalPolicy — cluster-scoped singleton that configures default
# approval behavior for proposal workflow steps.
#
# If no ApprovalPolicy exists, all approval steps default to Manual.
---
apiVersion: agentic.openshift.io/v1alpha1
kind: ApprovalPolicy
metadata:
  name: cluster
spec:
  maxConcurrentRuns: 5
  stages:
    - name: Analysis
      approval: Manual
    - name: Execution
      approval: Manual
    - name: Verification
      approval: Manual
    # Escalation runs only after a verification failure and just produces an
    # EscalationResult report for a human to read. Keep it Automatic — if it
    # is omitted or Manual, every objective verification failure stalls at the
    # escalation approval gate. Set it to Manual only if you want to gate the
    # escalation agent itself.
    - name: Escalation
      approval: Automatic
